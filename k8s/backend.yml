apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  namespace: orion-microcrm
  labels:
    app.kubernetes.io/name: orion-microcrm
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-microcrm
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-microcrm
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: back
          image: orion-microcrm-back:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: back
  namespace: orion-microcrm
  labels:
    app.kubernetes.io/name: orion-microcrm
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orion-microcrm
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
