apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: orion-microcrm
  labels:
    app.kubernetes.io/name: orion-microcrm
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-microcrm
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-microcrm
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: front
          image: orion-microcrm-front:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: orion-microcrm
  labels:
    app.kubernetes.io/name: orion-microcrm
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orion-microcrm
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
