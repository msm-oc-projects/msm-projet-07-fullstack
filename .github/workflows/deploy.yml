name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check deployment configuration
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deployment secrets
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=0

          for secret_name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!secret_name}" ]; then
              echo "::warning title=Missing deployment secret::${secret_name} is not configured."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"

            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error title=Deployment unavailable::Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_PATH before running a manual deployment."
              exit 1
            fi

            echo "::notice title=Deployment skipped::No deployment target is configured, so the automatic staging deployment is skipped."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    environment: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Update server and restart services
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
            set -e
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose config
            docker compose up --build -d --remove-orphans
            docker compose ps
            docker compose logs --tail=100
            docker image prune -f
          EOF

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key
