name: Deploy

# Le staging suit automatiquement une CI réussie ; la production reste manuelle.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  # Le workflow lit le dépôt, mais ne le modifie pas.
  contents: read

# Empêche deux déploiements simultanés vers le même environnement.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  # Déploiement direct sur la VM portant les labels du runner auto-hébergé.
  deploy:
    name: Déployer avec Docker Compose
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    timeout-minutes: 20
    steps:
      # Le déploiement automatique reprend exactement le commit validé par la CI.
      - name: Récupérer la version à déployer
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier la plateforme de déploiement
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker compose config

      # Les images sont reconstruites sur la VM, puis Compose attend les healthchecks.
      - name: Construire et démarrer l'application
        run: docker compose up --build -d --remove-orphans --wait --wait-timeout 240

      - name: Vérifier le déploiement
        shell: bash
        run: |
          set -euo pipefail
          docker compose ps
          curl --fail --silent --show-error http://localhost/ > /dev/null
          curl --fail --silent --show-error http://localhost/api/persons > /dev/null

      - name: Afficher les journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail=200

      # Le nettoyage ne supprime que les images qui ne sont plus référencées.
      - name: Nettoyer les images inutilisées
        if: success()
        run: docker image prune -f
