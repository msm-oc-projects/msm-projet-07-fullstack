name: Release

# Une release est créée depuis un tag SemVer poussé ou sélectionné manuellement.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag SemVer existant à publier, par exemple v1.0.0
        required: true
        type: string

permissions:
  # Le droit d'écriture est limité à la création de la release GitHub.
  contents: write

# Versions communes utilisées pour reconstruire les artefacts.
env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  release:
    name: Construire les artefacts et publier la release
    runs-on: ubuntu-latest
    steps:
      # Refuse les tags ne respectant pas le format stable vMAJOR.MINOR.PATCH.
      - name: Déterminer le tag de release
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must follow stable SemVer format vMAJOR.MINOR.PATCH, for example v1.0.0." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Récupérer le tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Construire l'artefact backend
        working-directory: back
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Construire l'artefact frontend
        working-directory: front
        run: |
          npm ci
          npm run build

      # Le JAR et les fichiers Angular sont renommés avec la version de la release.
      - name: Préparer les artefacts de release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release_tag.outputs.version }}"
          mkdir -p release-assets

          cp back/build/libs/microcrm-0.0.1-SNAPSHOT.jar "release-assets/orion-microcrm-back-${VERSION}.jar"
          tar -czf "release-assets/orion-microcrm-front-${VERSION}.tar.gz" -C front/dist/microcrm/browser .

          test -s "release-assets/orion-microcrm-back-${VERSION}.jar"
          test -s "release-assets/orion-microcrm-front-${VERSION}.tar.gz"

      - name: Publier les artefacts du workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ steps.release_tag.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Orion MicroCRM ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
