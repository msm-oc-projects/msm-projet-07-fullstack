name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build and test backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            back/build/reports/tests/test
            back/build/reports/jacoco/test
            back/build/classes/java/main
          if-no-files-found: error

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: front/coverage
          if-no-files-found: error

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download backend reports
        uses: actions/download-artifact@v8
        with:
          name: backend-test-reports
          path: back/build

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: front/coverage

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: back
          push: false
          tags: orion-microcrm-back:ci

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: front
          push: false
          tags: orion-microcrm-front:ci

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start application with Docker Compose
        run: docker compose up --build -d

      - name: Check containers
        run: docker compose ps

      - name: Stop application
        if: always()
        run: docker compose down --remove-orphans
