name: Periodic Checks

# Contrôle hebdomadaire le lundi à 05:00 UTC, également exécutable à la demande.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  # Aucun droit d'écriture n'est nécessaire pour les contrôles périodiques.
  contents: read

jobs:
  # Rejoue les tests et contrôle les dépendances livrées en production.
  tests-and-security:
    name: Tests hebdomadaires et audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Tester le backend
        working-directory: back
        run: |
          chmod +x ./gradlew
          ./gradlew clean test

      - name: Installer les dépendances frontend
        working-directory: front
        run: npm ci

      - name: Tester le frontend
        working-directory: front
        run: npm run test:ci

      # L'audit porte uniquement sur les dépendances présentes dans l'image finale.
      - name: Auditer les dépendances frontend de production
        id: frontend_audit
        continue-on-error: true
        working-directory: front
        run: npm audit --omit=dev --audit-level=critical --json > npm-audit-report.json

      - name: Publier le rapport d'audit frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dependency-audit
          path: front/npm-audit-report.json
          if-no-files-found: ignore

      - name: Résumer l'audit des dépendances frontend
        if: always()
        working-directory: front
        shell: bash
        run: |
          if [ ! -s npm-audit-report.json ]; then
            echo "::warning title=Frontend dependency audit::The npm audit report was not generated."
            exit 0
          fi

          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("npm-audit-report.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};

          const summary = [
            "### Frontend production dependency audit",
            "",
            `- Critical: ${counts.critical ?? 0}`,
            `- High: ${counts.high ?? 0}`,
            `- Moderate: ${counts.moderate ?? 0}`,
            `- Low: ${counts.low ?? 0}`,
          ].join("\n");

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);

          if ((counts.high ?? 0) > 0) {
            console.log(`::warning title=High severity frontend dependencies::${counts.high} high severity vulnerabilities require a planned Angular upgrade.`);
          }
          NODE

      - name: Valider Docker Compose
        run: docker compose config

      # Les niveaux élevés sont signalés ; le niveau critique bloque le workflow.
      - name: Appliquer le seuil des vulnérabilités critiques
        if: ${{ steps.frontend_audit.outcome == 'failure' }}
        run: |
          echo "::error title=Critical frontend dependency vulnerability::The production dependency audit detected at least one critical vulnerability."
          exit 1
