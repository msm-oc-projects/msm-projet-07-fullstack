name: Periodic Checks

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-security:
    name: Weekly tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Backend tests
        working-directory: back
        run: |
          chmod +x ./gradlew
          ./gradlew clean test

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Frontend tests
        working-directory: front
        run: npm run test:ci

      - name: Audit frontend production dependencies
        id: frontend_audit
        continue-on-error: true
        working-directory: front
        run: npm audit --omit=dev --audit-level=critical --json > npm-audit-report.json

      - name: Upload frontend dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dependency-audit
          path: front/npm-audit-report.json
          if-no-files-found: ignore

      - name: Summarize frontend dependency audit
        if: always()
        working-directory: front
        shell: bash
        run: |
          if [ ! -s npm-audit-report.json ]; then
            echo "::warning title=Frontend dependency audit::The npm audit report was not generated."
            exit 0
          fi

          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("npm-audit-report.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};

          const summary = [
            "### Frontend production dependency audit",
            "",
            `- Critical: ${counts.critical ?? 0}`,
            `- High: ${counts.high ?? 0}`,
            `- Moderate: ${counts.moderate ?? 0}`,
            `- Low: ${counts.low ?? 0}`,
          ].join("\n");

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);

          if ((counts.high ?? 0) > 0) {
            console.log(`::warning title=High severity frontend dependencies::${counts.high} high severity vulnerabilities require a planned Angular upgrade.`);
          }
          NODE

      - name: Docker Compose validation
        run: docker compose config

      - name: Enforce critical dependency threshold
        if: ${{ steps.frontend_audit.outcome == 'failure' }}
        run: |
          echo "::error title=Critical frontend dependency vulnerability::The production dependency audit detected at least one critical vulnerability."
          exit 1
