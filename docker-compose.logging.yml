# Extension du Compose principal activant l'envoi des journaux vers Logstash.
# Utilisation : docker compose -f docker-compose.yml -f docker-compose.logging.yml up -d
services:
  back:
    logging:
      # Le pilote GELF transmet les sorties standard du backend à Logstash.
      driver: gelf
      options:
        gelf-address: "${GELF_ADDRESS:-udp://localhost:12201}"
        tag: "orion-microcrm-back"

  front:
    logging:
      # Le même mécanisme centralise les journaux JSON produits par Caddy.
      driver: gelf
      options:
        gelf-address: "${GELF_ADDRESS:-udp://localhost:12201}"
        tag: "orion-microcrm-front"
