input {
  gelf {
    port => 12201
  }

  tcp {
    port => 5000
    codec => json_lines
  }

  beats {
    port => 5044
  }
}

filter {
  if [container_name] =~ /back/ {
    mutate {
      add_field => { "service" => "back" }
    }
  } else if [container_name] =~ /front/ {
    mutate {
      add_field => { "service" => "front" }
    }
  }

  if [short_message] {
    mutate {
      rename => { "short_message" => "message" }
    }
  }

  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "app_log"
      skip_on_invalid_json => true
    }

    if [app_log][level] {
      mutate {
        add_field => { "log_level" => "%{[app_log][level]}" }
      }
    }
  }

  if ![log_level] and [level] {
    mutate {
      add_field => { "log_level" => "%{[level]}" }
    }
  }

  mutate {
    add_field => {
      "application" => "orion-microcrm"
      "environment" => "local"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orion-microcrm-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
