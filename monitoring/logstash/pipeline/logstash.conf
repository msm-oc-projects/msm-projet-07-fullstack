input {
  gelf {
    port => 12201
  }

  tcp {
    port => 5000
    codec => json_lines
  }

  beats {
    port => 5044
  }
}

filter {
  if [container_name] =~ /back/ or [tag] =~ /back/ {
    mutate {
      add_field => { "service" => "back" }
    }
  } else if [container_name] =~ /front/ or [tag] =~ /front/ {
    mutate {
      add_field => { "service" => "front" }
    }
  }

  if [short_message] {
    mutate {
      rename => { "short_message" => "message" }
    }
  }

  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "app_log"
      skip_on_invalid_json => true
    }

    if [app_log][level] {
      mutate {
        add_field => { "log_level" => "%{[app_log][level]}" }
      }
    }

    if [app_log][logger_name] {
      mutate {
        add_field => { "logger_name" => "%{[app_log][logger_name]}" }
      }
    }

    if [app_log][thread_name] {
      mutate {
        add_field => { "thread_name" => "%{[app_log][thread_name]}" }
      }
    }

    if [app_log][status] {
      mutate {
        add_field => { "http_status" => "%{[app_log][status]}" }
        convert => { "http_status" => "integer" }
      }
    }

    if [app_log][duration] {
      mutate {
        add_field => { "duration_seconds" => "%{[app_log][duration]}" }
        convert => { "duration_seconds" => "float" }
      }
      ruby {
        code => 'event.set("duration_ms", (event.get("duration_seconds").to_f * 1000).round(2)) if event.get("duration_seconds")'
      }
    }
  }

  if ![log_level] and [level] {
    mutate {
      add_field => { "log_level" => "%{[level]}" }
    }
  }

  mutate {
    add_field => {
      "application" => "orion-microcrm"
      "environment" => "local"
    }
  }

  mutate {
    uppercase => ["log_level"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orion-microcrm-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
