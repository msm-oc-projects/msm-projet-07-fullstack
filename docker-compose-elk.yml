services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.10}
    container_name: orion-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.17.10}
    container_name: orion-logstash
    depends_on:
      - elasticsearch
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "12201:12201/udp"
      - "5000:5000"
      - "5044:5044"
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - elk
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.17.10}
    container_name: orion-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - elk
    restart: unless-stopped

  kibana-init:
    image: curlimages/curl:8.11.1
    container_name: orion-kibana-init
    depends_on:
      - kibana
    volumes:
      - ./monitoring/kibana:/kibana:ro
    networks:
      - elk
    command: >
      sh -c '
        until curl -fsS http://kibana:5601/api/status > /dev/null; do
          sleep 5;
        done;
        curl -fsS -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" -H "kbn-xsrf: true" --form file=@/kibana/orion-microcrm-dashboard.ndjson
      '
    restart: "no"

networks:
  elk:
    driver: bridge

volumes:
  elasticsearch-data:
