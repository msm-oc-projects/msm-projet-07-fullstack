services:
  # Stockage et indexation des journaux applicatifs.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.10}
    container_name: orion-elasticsearch
    environment:
      # Configuration locale mono-nœud sans authentification.
      # Elle ne doit pas être utilisée telle quelle en production.
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk
    restart: unless-stopped

  # Réception, transformation et transmission des journaux vers Elasticsearch.
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.17.10}
    container_name: orion-logstash
    depends_on:
      - elasticsearch
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      # GELF reçoit les journaux produits par les conteneurs de l'application.
      - "12201:12201/udp"
      # Entrées TCP JSON et Beats disponibles pour des collecteurs complémentaires.
      - "5000:5000"
      - "5044:5044"
    volumes:
      # La configuration du pipeline est montée en lecture seule.
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - elk
    restart: unless-stopped

  # Interface de consultation et de visualisation des journaux.
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.17.10}
    container_name: orion-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - elk
    restart: unless-stopped

  # Conteneur éphémère chargé d'importer automatiquement le dashboard Kibana.
  kibana-init:
    image: curlimages/curl:8.11.1
    container_name: orion-kibana-init
    depends_on:
      - kibana
    volumes:
      - ./monitoring/kibana:/kibana:ro
    networks:
      - elk
    command: >
      sh -c '
        until curl -fsS http://kibana:5601/api/status > /dev/null 2>&1; do
          sleep 5;
        done;
        curl -fsS --retry 30 --retry-all-errors --retry-delay 5 -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" -H "kbn-xsrf: true" --form file=@/kibana/orion-microcrm-dashboard.ndjson
      '
    restart: "no"

networks:
  # Réseau isolé réservé aux composants de la stack ELK.
  elk:
    driver: bridge

volumes:
  # Volume persistant conservant les index Elasticsearch entre les redémarrages.
  elasticsearch-data:
